<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ledger PWA</title>
  <link rel="manifest" href="./manifest.json" />
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
  <style>
    body { font-family: sans-serif; padding: 1rem; direction: rtl; }
    input, button { margin: .5rem 0; display: block; }
    #debug { background: #f0f0f0; padding: .5rem; height: 10rem; overflow: auto; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div id="app">
    <h1>ورود / ثبت‌نام</h1>
    <input type="email"    id="email"    placeholder="ایمیل" />
    <input type="password" id="password" placeholder="رمز عبور" />
    <button id="btnLogin">ورود</button>
    <button id="btnSignup">ثبت‌نام</button>
    <pre id="debug"></pre>
  </div>

  <script>
    // helper برای نمایش لاگ‌ها
    function log(...args){
      const pre = document.getElementById('debug');
      pre.textContent += args.join(' ') + "\n";
      console.log(...args);
    }

    // Supabase client (lazy init)
    let _sb = null;
    function getSupabaseClient(){
      if (!_sb){
        _sb = supabase.createClient(
          'https://aoujnczurxoqnvyqfxsa.supabase.co',
          'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdWpuY3p1cnhvcW52eXFmeHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDg2NjAsImV4cCI6MjEwMjI4NDY2MH0.feRmvkPByEFRKI-QQzNP4waGqmpXt1_xf7RKa9aI9Po'
        );
      }
      return _sb;
    }

    // تعداد دفعات PBKDF2
    const KDF_ITER = 210000;

    // تابع doLogin برای login/signup
    async function doLogin(mode){
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) throw new Error("ایمیل/رمز را وارد کنید.");

      const sb = getSupabaseClient();
      let res;
      if (mode === "signup"){
        res = await sb.auth.signUp({ email, password });
      } else {
        res = await sb.auth.signInWithPassword({ email, password });
      }
      if (res.error) throw new Error(res.error.message);
      console.log("🔐 Supabase Auth Response:", res);
      return res.data.user;
    }

    // ارسال salt و iterations و updated_at به جدول user_kdf
    async function pushSaltToServerIfPossible(user){
      if (!user || !user.id) {
        log("user_kdf not synced (error): invalid user");
        return;
      }
      const salt_b64 = localStorage.getItem('salt_b64');
      if (!salt_b64){
        log("user_kdf not synced (ok): no salt stored locally");
        return;
      }
      const payload = {
        user_id:    user.id,
        salt_b64,
        iterations: KDF_ITER,
        updated_at: new Date().toISOString()
      };
      try {
        const sb = getSupabaseClient();
        const { data, error } = await sb
          .from("user_kdf")
          .upsert(payload, { onConflict: "user_id" });
        if (error) throw error;
        log("user_kdf upsert ok.");
      } catch(err) {
        const m = (err.message||'').toLowerCase();
        if (m.includes("iterations")) {
          log("user_kdf not synced (ok): missing 'iterations' column");
        } else if (m.includes("updated_at")) {
          log("user_kdf not synced (ok): missing 'updated_at' column");
        } else {
          log("user_kdf upsert error:", err.message);
        }
      }
    }

    // پس از ورود موفق، نمایش UI اپلیکیشن اصلی
    function onLoggedIn(user){
      const app = document.getElementById('app');
      app.innerHTML = `
        <h2>خوش آمدید، ${user.email}</h2>
        <button id="btnLogout">خروج</button>
        <button id="btnSync">Sync</button>
        <pre id="debug"></pre>
      `;
      // ثبت handler خروج
      document.getElementById('btnLogout').addEventListener('click', async ()=>{
        await getSupabaseClient().auth.signOut();
        location.reload();
      });
      // ثبت handler Sync (نمونه)
      document.getElementById('btnSync').addEventListener('click', async ()=>{
        log("Sync…");
        // اینجا تابع sync تراکنش‌ها را صدا بزنید
      });
    }

    // handler دکمه Login
    document.getElementById('btnLogin').addEventListener('click', async (e)=>{
      e.preventDefault();
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        log("Login…");
        const user = await doLogin("login");
        if (!user || !user.id) throw new Error("کاربر برگشتی نامعتبر است.");
        log("Logged in, user.id =", user.id);
        await pushSaltToServerIfPossible(user);
        log("Login ok.");
        onLoggedIn(user);
      } catch(err) {
        log("Login failed:", err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // handler دکمه Signup
    document.getElementById('btnSignup').addEventListener('click', async (e)=>{
      e.preventDefault();
      const btn = e.currentTarget;
      btn.disabled = true;
      try {
        log("Signup…");
        const user = await doLogin("signup");
        log("Signed up, user.id =", user.id);
        await pushSaltToServerIfPossible(user);
        log("Signup ok.");
        onLoggedIn(user);
      } catch(err) {
        log("Signup failed:", err.message);
      } finally {
        btn.disabled = false;
      }
    });

    // ثبت Service Worker
    if ('serviceWorker' in navigator){
      navigator.serviceWorker.register('./sw.js')
        .then(()=> log("SW registered"))
        .catch(err=> log("SW registration failed:", err.message));
    }
  </script>

</body>
</html>
