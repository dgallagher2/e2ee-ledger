<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>اپلیکیشن مالی (PWA Offline + E2EE)</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#2196f3"/>

  <style>
    body { font-family: sans-serif; padding: 1rem; direction: rtl; }
    .hidden { display: none; }
    label { display: block; margin-top: .5rem; }
    input, select, button { margin-top: .2rem; padding: .4rem; width: 100%; box-sizing: border-box;}
    #tx-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    #tx-table th, #tx-table td { border: 1px solid #ccc; padding: .4rem; text-align: center; }
  </style>
</head>
<body>

  <!-- ۱) صفحه ورود -->
  <div id="login-screen">
    <h2>ورود با ایمیل و رمز</h2>
    <input type="email" id="email" placeholder="ایمیل" />
    <input type="password" id="password" placeholder="رمز عبور" />
    <button id="btn-login">ورود</button>
  </div>

  <!-- ۲) صفحه باز کردن داده‌های محلی -->
  <div id="unlock-screen" class="hidden">
    <h2>کد عبور محلی (برای رمزنگاری)</h2>
    <input type="password" id="local-pass" placeholder="کد عبور دلخواه" />
    <button id="btn-unlock">باز کردن</button>
  </div>

  <!-- ۳) صفحه اصلی اپ -->
  <div id="app" class="hidden">
    <h2>دفتر مالی</h2>

    <form id="tx-form">
      <label for="date">تاریخ:</label>
      <input type="date" id="date" required />

      <label for="type">نوع تراکنش:</label>
      <select id="type" name="type" required>
        <option value="" disabled selected>یک مورد انتخاب کنید</option>
      </select>

      <!-- فیلدهای داینامیک -->
      <div class="field-showcase hidden">
        <label>ویترین - توضیحات:</label>
        <input type="text" id="showcase-desc" placeholder="مثلاً طلا ۱۸ عیار" />
      </div>

      <div class="field-molten hidden">
        <label>آب‌شده - عیار پیشنهادی:</label>
        <button type="button" class="set-750">۷۵۰</button>
        <button type="button" class="set-740">۷۴۰</button>
        <button type="button" class="set-900">۹۰۰</button>
        <input type="number" id="molten-karat" placeholder="عیار دلخواه" />
      </div>

      <div class="field-bankCoin hidden">
        <label>سکه بانکی:</label>
        <select id="coin-bank-weight">
          <option value="1">تمام (۸.۱۳۳ گرم)</option>
          <option value="0.5">نیم (۴.۰۶۰ گرم)</option>
          <option value="0.25">ربع (۲.۰۳۳ گرم)</option>
        </select>
        <label>عیار (قفل‌شده روی ۹۰۰):</label>
        <input type="number" value="900" readonly />
      </div>

      <div class="field-normalCoin hidden">
        <label>سکه عادی - تعداد:</label>
        <input type="number" id="coin-normal-count" min="1" value="1" />
        <label>عیار (قفل‌شده روی ۹۰۰):</label>
        <input type="number" value="900" readonly />
      </div>

      <div class="field-dollar hidden">
        <label>مقدار دلار:</label>
        <input type="number" id="dollar-amount" step="0.01" />
      </div>

      <label for="price">قیمت (ریال):</label>
      <input type="text" id="price" required />

      <button type="submit">ثبت تراکنش</button>
    </form>

    <button id="btn-sync">سینک</button>
    <button id="btn-export">خروجی CSV</button>
    <button id="btn-conflicts">بررسی تعارض‌ها</button>

    <table id="tx-table">
      <thead>
        <tr><th>تاریخ</th><th>نوع</th><th>جزئیات</th><th>قیمت</th><th>وضعیت</th></tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <script>
  //====== کانفیگ Supabase ======
  const SUPABASE_URL  = "https://YOUR-URL.supabase.co";
  const SUPABASE_ANON = "YOUR-ANON-KEY";
  const supabase = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON);

  //====== E2EE با PBKDF2 و AES-GCM ======
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 100000,
        hash: "SHA-256"
      },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt","decrypt"]
    );
  }

  function generateSalt() {
    return crypto.getRandomValues(new Uint8Array(16));
  }

  async function encryptRecord(key, obj) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const enc = new TextEncoder();
    const data = enc.encode(JSON.stringify(obj));
    const cipher = await crypto.subtle.encrypt(
      { name:"AES-GCM", iv }, key, data
    );
    return {
      iv: Array.from(iv),
      data: Array.from(new Uint8Array(cipher))
    };
  }

  async function decryptRecord(key, record) {
    const iv = new Uint8Array(record.iv);
    const data = new Uint8Array(record.data);
    const plain = await crypto.subtle.decrypt(
      { name:"AES-GCM", iv }, key, data
    );
    return JSON.parse(new TextDecoder().decode(plain));
  }

  //====== IndexedDB برای ذخیره آفلاین ======
  function openDB() {
    return new Promise((res, rej) => {
      const rq = indexedDB.open("ledger-db", 1);
      rq.onupgradeneeded = e => {
        const db = e.target.result;
        const txStore = db.createObjectStore("transactions", { keyPath: "id", autoIncrement:true });
        txStore.createIndex("status", "status");
        db.createObjectStore("queue", { keyPath: "qid", autoIncrement:true });
        db.createObjectStore("conflicts", { keyPath: "cid", autoIncrement:true });
      };
      rq.onsuccess = () => res(rq.result);
      rq.onerror   = () => rej(rq.error);
    });
  }

  async function addLocal(tx) {
    const db = await openDB();
    const t = db.transaction("transactions","readwrite");
    t.objectStore("transactions").add(tx);
    return t.complete;
  }

  async function addToQueue(item) {
    const db = await openDB();
    const t = db.transaction("queue","readwrite");
    t.objectStore("queue").add(item);
    return t.complete;
  }

  async function updateLocal(id, changes) {
    const db = await openDB();
    const t = db.transaction("transactions","readwrite");
    const store = t.objectStore("transactions");
    const rec = await store.get(id);
    Object.assign(rec, changes);
    store.put(rec);
    return t.complete;
  }

  async function getAllStore(storeName) {
    const db = await openDB();
    const tx = db.transaction(storeName,"readonly");
    const store = tx.objectStore(storeName);
    return new Promise(res => {
      const all = [];
      store.openCursor().onsuccess = e => {
        const c = e.target.result;
        if (!c) return res(all);
        all.push(c.value);
        c.continue();
      };
    });
  }

  //====== Sync با Supabase ======
  async function syncAll() {
    const queue = await getAllStore("queue");
    for (const item of queue) {
      // ارسال داده به supabase
      const { data, error } = await supabase
        .from("transactions")
        .insert(item.payload);
      if (error) {
        // در صورت conflict، داخل conflicts ذخیره کن
        await (await openDB()).transaction("conflicts","readwrite")
          .objectStore("conflicts").add({ local: item.payload, error });
      } else {
        // در صورت موفق، وضعیت local را به synced بروز کن
        await updateLocal(item.localId, { status: "synced" });
      }
      // حذف از queue
      const db = await openDB();
      db.transaction("queue","readwrite").objectStore("queue").delete(item.qid);
    }
    renderTable();
  }

  //====== UI & Dynamic Form ======
  const types = [
    { value: "showcase",   label: "ویترین"    },
    { value: "molten",     label: "آب‌شده"    },
    { value: "bankCoin",   label: "سکه بانکی" },
    { value: "normalCoin", label: "سکه عادی"  },
    { value: "dollar",     label: "دلار"      }
  ];

  function populateTypes() {
    const sel = document.getElementById("type");
    sel.querySelectorAll("option:not([value=\"\"])").forEach(o=>o.remove());
    types.forEach(t => {
      const opt = document.createElement("option");
      opt.value = t.value;
      opt.textContent = t.label;
      sel.appendChild(opt);
    });
  }

  function updateFormByType(type) {
    document.querySelectorAll("[class^='field-']").forEach(el => el.classList.add("hidden"));
    const f = document.querySelector(`.field-${type}`);
    if (f) f.classList.remove("hidden");
  }

  function formatPriceInput() {
    const ip = document.getElementById("price");
    ip.addEventListener("input", e => {
      let v = e.target.value.replace(/\D/g,"");
      e.target.value = v.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
    });
  }

  function renderTable() {
    getAllStore("transactions").then(arr => {
      const tbody = document.querySelector("#tx-table tbody");
      tbody.innerHTML = "";
      arr.forEach(tx => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${tx.date}</td>
          <td>${tx.type}</td>
          <td>${JSON.stringify(tx.details)}</td>
          <td>${tx.price}</td>
          <td>${tx.status}</td>`;
        tbody.appendChild(tr);
      });
    });
  }

  //====== Export به CSV ======
  function exportCSV() {
    getAllStore("transactions").then(arr => {
      let csv = "date,type,details,price,status\n";
      arr.forEach(r => {
        csv += `"${r.date}","${r.type}","${JSON.stringify(r.details)}","${r.price}","${r.status}"\n`;
      });
      const blob = new Blob([csv],{ type:"text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "ledger.csv";
      a.click();
    });
  }

  //====== رویدادها ======
  document.addEventListener("DOMContentLoaded", () => {
    populateTypes();
    formatPriceInput();
    renderTable();

    // تغییر نوع تراکنش
    document.getElementById("type")
      .addEventListener("change", e => updateFormByType(e.target.value));

    // ثبت تراکنش جدید
    document.getElementById("tx-form").addEventListener("submit", async e => {
      e.preventDefault();
      const date  = document.getElementById("date").value;
      const type  = document.getElementById("type").value;
      // جمع‌آوری جزئیات بر اساس نوع
      let details = {};
      if (type==="showcase") details.desc = document.getElementById("showcase-desc").value;
      if (type==="molten")   details.karat = document.getElementById("molten-karat").value;
      if (type==="bankCoin") details.weight = document.getElementById("coin-bank-weight").value;
      if (type==="normalCoin")details.count = document.getElementById("coin-normal-count").value;
      if (type==="dollar")   details.amount = document.getElementById("dollar-amount").value;
      const price = document.getElementById("price").value.replace(/,/g,"");

      // رمزنگاری رکورد به‌دلخواه (اگر کلید محلی دارید)
      // ---
      // ذخیره محلی
      const localTx = { date, type, details, price, status:"pending" };
      const id = await addLocal(localTx);

      // قرار دادن در صف برای همگام‌سازی
      await addToQueue({ localId:id, payload: localTx });

      renderTable();
      e.target.reset();
    });

    // دکمه سینک
    document.getElementById("btn-sync").addEventListener("click", () => {
      syncAll();
    });

    // خروجی CSV
    document.getElementById("btn-export").addEventListener("click", () => {
      exportCSV();
    });

    // بررسی تعارض‌ها
    document.getElementById("btn-conflicts").addEventListener("click", async () => {
      const confs = await getAllStore("conflicts");
      if (!confs.length) return alert("تعریضی وجود ندارد");
      console.table(confs);
      alert("لطفاً در کنسول مرورگر تعارض‌ها را ببینید (برای نمونه)");
    });
  });

  //====== ثبت Service Worker ======
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js")
      .then(()=>console.log("SW registered"))
      .catch(console.error);
  }
  </script>
</body>
</html>
