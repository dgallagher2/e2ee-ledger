<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>دفتر مالی آفلاین با E2EE</title>
  <link rel="manifest" href="manifest.json" />

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>

  <style>
    body { font-family: sans-serif; padding: 1em; }
    #debug { margin-top:1em; background:#f0f0f0; padding:0.5em; height:150px; overflow:auto; font-size:0.9em; }
    #app { display:none; }
    label { display:block; margin:0.5em 0; }
    input { padding:0.3em; width:100%; max-width:300px; }
    button { margin-right:0.5em; padding:0.5em 1em; }
  </style>
</head>
<body>
  <h1>دفتر مالی با E2EE</h1>

  <div id="auth-form">
    <label>ایمیل: <input type="email" id="email" /></label>
    <label>رمز:   <input type="password" id="password"/></label>
    <button id="btnLogin">ورود</button>
    <button id="btnSignup">ثبت‌نام</button>
  </div>

  <div id="app">
    <p>کاربر وارد شده: <strong><span id="user-id"></span></strong></p>
    <!-- TODO: فرم تراکنش، لیست دارایی‌ها، دکمه Sync و Export -->
  </div>

  <div id="debug"></div>

  <script>
    // ==== CONFIGURATION ====
    const SUPA_REF    = 'https://aoujnczurxoqnvyqfxsa.supabase.co';
    const SUPA_ANON   = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFvdWpuY3p1cnhvcW52eXFmeHNhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDg2NjAsImV4cCI6MjEwMjI4NDY2MH0.feRmvkPByEFRKI-QQzNP4waGqmpXt1_xf7RKa9aI9Po';
    const KDF_ITER    = 210000;
    const DB_NAME     = 'ledger-db';
    const DB_VERSION  = 2;

    // ==== DEBUG LOG ====
    function log(...args){
      const p = document.createElement('div');
      p.textContent = args.map(a=>(typeof a==='object'? JSON.stringify(a):a)).join(' ');
      document.getElementById('debug').appendChild(p);
      console.log(...args);
    }

    // ==== Supabase Client ====
    let _sb = null;
    function getSupabaseClient(){
      if (!_sb) {
        _sb = supabase.createClient(SUPA_REF, SUPA_ANON);
      }
      return _sb;
    }

    // ==== WebCrypto Helpers ====
    function makeSalt(){
      const arr = crypto.getRandomValues(new Uint8Array(16));
      return btoa(String.fromCharCode(...arr));
    }
    async function ensureSalt(){
      let salt = localStorage.getItem('salt_b64');
      if (!salt) {
        salt = makeSalt();
        localStorage.setItem('salt_b64', salt);
        log("Generated new salt and stored locally");
      }
      return salt;
    }
    async function deriveKey(password, salt_b64){
      const enc = new TextEncoder();
      const passKey = await crypto.subtle.importKey(
        'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
      );
      const salt = Uint8Array.from(atob(salt_b64), c=>c.charCodeAt(0));
      return crypto.subtle.deriveKey({
        name: 'PBKDF2', salt, iterations: KDF_ITER, hash: 'SHA-256'
      }, passKey, { name:'AES-GCM', length:256 }, true, ['encrypt','decrypt']);
    }

    // ==== IndexedDB SETUP ====
    let dbPromise = null;
    function getDB(){
      if (!dbPromise){
        dbPromise = new Promise((res, rej)=>{
          const req = indexedDB.open(DB_NAME, DB_VERSION);
          req.onupgradeneeded = e=>{
            const db = e.target.result;
            ['records','queue'].forEach(store=>{
              if (!db.objectStoreNames.contains(store))
                db.createObjectStore(store, { keyPath:'id' });
            });
            if (!db.objectStoreNames.contains('meta'))
              db.createObjectStore('meta',    { keyPath:'key' });
            if (!db.objectStoreNames.contains('conflicts'))
              db.createObjectStore('conflicts',{ keyPath:'id', autoIncrement:true });
          };
          req.onsuccess = ()=>res(req.result);
          req.onerror   = ()=>rej(req.error);
        });
      }
      return dbPromise;
    }

    // ==== AUTH FUNCTIONS ====
    async function doLogin(mode){
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) throw new Error("ایمیل و رمز را وارد کنید.");
      const sb = getSupabaseClient();
      let res;
      if (mode === 'signup') {
        res = await sb.auth.signUp({ email, password });
      } else {
        res = await sb.auth.signInWithPassword({ email, password });
      }
      if (res.error) throw new Error(res.error.message);
      log("🔐 Supabase Auth Response:", res);
      return res.data.user;
    }

    // ==== UPSERT user_kdf ====
    async function pushSaltToServerIfPossible(user){
      if (!user || !user.id) {
        log("user_kdf upsert skipped: invalid user");
        return;
      }
      const salt_b64 = await ensureSalt();
      const payload = {
        user_id:    user.id,
        salt_b64,
        iterations: KDF_ITER,
        updated_at: new Date().toISOString()
      };
      try {
        const sb = getSupabaseClient();
        const { data, error } = await sb
          .from("user_kdf")
          .upsert(payload, { onConflict: "user_id" });
        if (error) throw error;
        log("user_kdf upsert ok.");
      } catch(err){
        log("user_kdf upsert error:", err.message || err);
      }
    }

    function onLoggedIn(user){
      document.getElementById('auth-form').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('user-id').textContent = user.id;
    }

    // ==== DOM & EVENTS ====
    window.addEventListener('DOMContentLoaded', ()=>{
      const btnLogin  = document.getElementById('btnLogin');
      const btnSignup = document.getElementById('btnSignup');

      btnLogin.addEventListener('click', async e=>{
        e.preventDefault();
        btnLogin.disabled = true;
        try {
          log("Login…");
          const user = await doLogin("login");
          log("Logged in, user.id =", user.id);
          await pushSaltToServerIfPossible(user);
          log("Login complete.");
          onLoggedIn(user);
        } catch(err){
          log("Login failed:", err.message);
        } finally {
          btnLogin.disabled = false;
        }
      });

      btnSignup.addEventListener('click', async e=>{
        e.preventDefault();
        btnSignup.disabled = true;
        try {
          log("Signup…");
          const user = await doLogin("signup");
          log("Signed up, user.id =", user.id);
          await pushSaltToServerIfPossible(user);
          log("Signup complete.");
          onLoggedIn(user);
        } catch(err){
          log("Signup failed:", err.message);
        } finally {
          btnSignup.disabled = false;
        }
      });

      // initial view
      document.getElementById('auth-form').style.display = 'block';
      document.getElementById('app').style.display      = 'none';
    });

    // ==== SERVICE WORKER ====
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(_=>log("SW registered"))
        .catch(err=>log("SW register error:", err.message));
    }
  </script>
</body>
</html>
